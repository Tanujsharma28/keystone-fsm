services:
  - type: web
    name: keystone-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: keystone-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: keystone-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: keystone-db
          property: password
      - key: JWT_SECRET
        value: keystone-super-secret-key-2024-zidio!!
      - key: JWT_EXPIRATION
        value: 86400000
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: keystone-db
    plan: free
